services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - admin
    restart: unless-stopped

  admin:
    build: .
    env_file: .env
    volumes:
      - ${BEDROCK_DATA_PATH:-/opt/bedrock/data}:/bedrock-data
      - admin-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  admin-data:
  caddy-data:
  caddy-config:
